<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1a2e" rx="80"/>
  
  <!-- Hexagon Shape (representing blockchain) -->
  <polygon points="256,100 356,156 356,268 256,324 156,268 156,156" 
           fill="none" stroke="url(#grad)" stroke-width="12"/>
  
  <!-- Inner Eye Design (Echidna's mystical eye) -->
  <ellipse cx="256" cy="212" rx="80" ry="50" fill="url(#grad)" opacity="0.3"/>
  <circle cx="256" cy="212" r="30" fill="#f39c12"/>
  <circle cx="256" cy="212" r="15" fill="#1a1a2e"/>
  
  <!-- Letter E stylized -->
  <text x="256" y="430" font-family="'Orbitron', sans-serif" font-size="120" 
        font-weight="900" fill="url(#grad)" text-anchor="middle">E</text>
</svg>
